# Stack de desenvolvimento/teste: Postgres + NestJS (hot-reload) + Next.js (hot-reload).
# Uso: docker compose up --build
#   front  -> http://localhost:3000  (login: admin@admin.com / admin123)
#   api    -> http://localhost:8082
#   banco  -> localhost:5432 (user/senha/db abaixo)
# Reset total do banco de teste: docker compose down -v

name: resolve-ai

x-backend-env: &backend-env
  # Host `db` só existe na rede interna do compose; em execução local use localhost
  DATABASE_URL: postgresql://${POSTGRES_USER:-resolve}:${POSTGRES_PASSWORD:-resolve}@db:5432/${POSTGRES_DB:-resolve_test}?schema=public
  PORT: ${BACKEND_PORT:-8082}
  WHITELIST: ${FRONTEND_URL:-http://localhost:3000}
  JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-somente-para-testes}
  JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
  JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
  SALT_ROUNDS: ${SALT_ROUNDS:-10}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resolve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resolve}
      POSTGRES_DB: ${POSTGRES_DB:-resolve_test}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resolve} -d ${POSTGRES_DB:-resolve_test}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # One-shot: aplica as migrações do Prisma antes do backend subir.
  migrate:
    build: ./backend
    command: npx prisma migrate deploy
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    environment: *backend-env
    ports:
      - "${BACKEND_PORT:-8082}:8082"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8082/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    restart: unless-stopped

  front:
    build: ./front
    environment:
      # Inlined no bundle do client em tempo de build/dev -> precisa ser alcançável
      # pelo navegador (host do Docker), não pelo container.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8082}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./front:/app
      - front_node_modules:/app/node_modules
      - front_next:/app/.next
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  backend_node_modules:
  front_node_modules:
  front_next:
